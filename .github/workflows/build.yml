name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Install admin dashboard dependencies
        run: flutter pub get
        working-directory: admin_dashboard

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Analyze mobile app
        run: flutter analyze

      - name: Analyze admin dashboard
        run: flutter analyze
        working-directory: admin_dashboard

      - name: Lint functions
        run: npm run lint
        working-directory: functions

      - name: Check functions syntax
        run: node --check index.js
        working-directory: functions

      - name: Test mobile app with coverage
        run: flutter test --coverage

      - name: Test admin dashboard with coverage
        run: flutter test --coverage
        working-directory: admin_dashboard

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
